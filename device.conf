# devices/starlte/device.conf: the Samsung Galaxy S9 (SM-G960F, Exynos 9810). Kept in the common tree for now (devices/manifest.conf);
# README.md here has the port's state, the hardware's facts and where each came from, and how it is started.

device starlte
	title       Galaxy S9
	vendor      Samsung
	soc         exynos9810
	defconfig   starlte_defconfig
	maintainer  Scion (README.md)
	status      display     partial   the panel through UEFI's framebuffer (1440 x 2960 at 0xCC000000): seen on the phone; brightness by gamma and AOR through DSIM0 (panel=1, kern.hakios.brightness; iOS's slider through hakios.backlight.cpp, backlight=1 logs what iOS sets, backlight=2 takes it): written, not yet confirmed
	status      cpu         partial   A55s 2 and 3 (cpus=2 bootcpu=2, the default): seen on the phone; with the four M3s, six cores running iOS (cpus=6 bootcpu=2 m3_prep=3 pan=0; isa_floor on by m3_prep=3): seen on the phone, 2 November; core 1 is parked by S-Boot (README.md, The cores); the clusters' clocks through ACPM's DVFS (cpufreq_lit=kHz, cpufreq_big=kHz): the A55s at 1.79 GHz seen on the phone, 1 November
	status      touch       works     Samsung S6SY761 on USI03's HSI2C, ten fingers (s6sy761=1): seen on the phone, 1 November
	status      buttons     partial   power, volume, Bixby as home (exynos_keys=1): written, not yet seen on the phone
	status      storage     partial   UFS read through the loader and Silicium's UEFI (ufs=2); or by the kernel's own UFS driver, read only, as UEFI left the controller (ufs_native=4 ufs_native_soc=exynos9810, ufs_native_step=1..5): written, not yet seen on the phone
	status      gpu         partial   Mali-G72 MP18 (mali=N, nine steps; HakiosMali for Mesa's panfrost: OpenGL ES, and Metal through it, GPU.md): mali=9 seen on the phone, 1 November (CoreAnimation draws through Mesa's Panfrost); Metal not yet run
	status      audio       partial   ABOX, its CPU off: RDMA0 -> SIFS0 -> UAIF1, I2S 48 kHz 2 x 16 bits, a tone, then iOS's sound and volume (abox=N, 8 steps); the two MAX98512s on I2C (max98512=N, 3 steps; AUDIO.md): written, not yet heard
	status      battery     partial   the MAX77705's gauge and charger, read only, and the thermistor (ADC), into iOS's battery (max77705=1): the level and charger state seen on the phone, 1 November
	status      wifi        partial   BCM4361 on PCIe: stage 1, the root complex of channel 0, WLAN_REG_ON, the link and the chip's ID and BARs (wifi_pcie=N, 6 steps); stage 2, Linux's brcmfmac, INTx, the phone's address, the station and joining WPA2 (brcmfmac=N, 8 steps; firmware from the phone; WIFI.md): written, not yet seen
	status      bluetooth   partial   BCM4361's Bluetooth on UART_BT: BT_EN on the PCAL6524 expander, the UART in loopback, HCI_Reset and Read Local Version, Broadcom's patch from the phone and the version again (bt=N, 6 steps; no host stack; BLUETOOTH.md): written, not yet seen
	status      cellular    missing
	status      haptic      works     the MAX77705's haptic block and a PWM of the SoC, for iOS (max77705_haptic=1): felt on the phone, 1 November
	status      thermal     partial   the Exynos 9810's TMU read by the kernel (BIG, LITTLE, G3D, ISP with their fuses), kern.hakios.temp, and the run ended at 110 C or the battery at 60 C (tmu=N, 3 steps; tmu_off=1 powers off): written, not yet seen; nothing slows the cores or the GPU
	status      camera      partial   the front camera's S5K3H1, stage 1: its supplies on the S2MPB02, reset, MCLK and its model ID over I2C (cam_s9=1 a look, 2 power up, read, power down; CAMERA.md has the plan to raw frames through CSIS1's DMA, no ISP firmware): written, not yet seen
	status      torch       partial   the S2MPB02's flash block, lit by a pin (torch=1 a look, 3 for iOS): written, not yet seen
	status      usb         works     the port as a USB serial device: the kernel's whole log live and a line console (usb_gadget=N, 5 steps; DWC3 in device mode, CDC-ACM 1209:0001, the 2.0 PHY by the BSP's CAL sequence; max77705_usbsw=1 routes the port to the SoC): seen on the phone, 1 November
